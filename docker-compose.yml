services:
  app:
    build: .
    container_name: heynats_app
    ports:
      - "5000:5000"
    # Credentials come from your shell or a local .env (never committed).
    environment:
      - NATS_SERVERS=nats://nats:4222
      - NATS_USER=${NATS_USER:-admin}
      - NATS_PASSWORD=${NATS_PASSWORD:?set NATS_PASSWORD}
      - DASHBOARD_USER=${DASHBOARD_USER:?set DASHBOARD_USER}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:?set DASHBOARD_PASSWORD}
      - READONLY=${READONLY:-true}
    depends_on:
      - nats
  nats:
    image: nats:2.12.0
    container_name: heynats_server
    volumes:
      - ./nats_data:/tmp/jetstream
      - ./nats.conf:/app/nats.conf
    command: -c /app/nats.conf
    ports:
      - "4222:4222"
      - "8222:8222"